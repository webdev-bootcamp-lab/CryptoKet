<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create New Item</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>

  <body class="bg-[#0b0b0f] text-white min-h-screen font-sans">
    <div class="max-w-3xl mx-auto px-6 py-12 space-y-10">
      <h1 class="text-3xl md:text-4xl font-bold tracking-tight font-sans">
        Create new item
      </h1>

      <p class="text-sm font-medium text-gray-300 font-sans">Upload File</p>

      <div
        id="dropZone"
        class="border-2 bg-[#15151d] border-dashed border-gray-600 rounded-xl p-8 text-center cursor-pointer hover:border-pink-500 transition"
      >
        <p class="text-xs sm:text-sm text-gray-400 font-normal font-sans">
          JPG, PNG, GIF, SVG, WEBM, MP3, MP4 • Max 100MB
        </p>

        <input type="file" id="fileInput" hidden />

        <div class="space-y-3">
          <svg
            class="w-20 h-20 mx-auto my-4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            viewBox="0 0 24 24"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
            <circle cx="8" cy="8" r="1" />
            <polyline points="21 15 16 10 5 21" />
          </svg>

          <p
            class="text-base sm:text-lg font-semibold leading-relaxed font-sans"
          >
            Drag and Drop File <br />
            <span class="text-gray-400 font-normal">
              or browse media on your device
            </span>
          </p>

          <p
            id="fileName"
            class="text-pink-500 text-sm font-medium font-sans hidden"
          ></p>
        </div>
      </div>

      <p
        id="error"
        class="text-sm font-medium text-red-500 font-sans hidden"
      ></p>

      <div>
        <label class="block mb-2 text-sm font-medium text-gray-300 font-sans">
          Name
        </label>
        <input
          id="name"
          type="text"
          placeholder="Item Name"
          class="w-full bg-[#15151d] border border-gray-700 rounded-lg px-4 py-3 text-sm font-normal font-sans placeholder-gray-500 focus:outline-none focus:border-pink-500"
        />
      </div>

      <div>
        <label class="block mb-2 text-sm font-medium text-gray-300 font-sans">
          Description
        </label>
        <textarea
          id="description"
          rows="4"
          placeholder="Description of your item"
          class="w-full bg-[#15151d] border border-gray-700 rounded-lg px-4 py-3 text-sm font-normal font-sans placeholder-gray-500 focus:outline-none focus:border-pink-500"
        ></textarea>
      </div>

      <div>
        <label class="block mb-2 text-sm font-medium text-gray-300 font-sans">
          Price
        </label>
        <div class="flex gap-4">
          <input
            id="price"
            type="number"
            placeholder="Enter Price"
            class="flex-1 bg-[#15151d] border border-gray-700 rounded-lg px-4 py-3 text-sm font-normal font-sans placeholder-gray-500 focus:outline-none focus:border-pink-500"
          />
          <select
            id="currency"
            class="bg-[#15151d] border border-gray-700 rounded-lg px-4 py-3 text-sm font-medium font-sans"
          >
            <option value="ETH">ETH</option>
            <option value="BTC">BTC</option>
            <option value="USD">USD</option>
          </select>
        </div>
      </div>

      <!-- CTA -->
      <div class="flex justify-center md:justify-end">
        <button
          id="createBtn"
          class="w-60 py-4 rounded-xl text-sm md:text-base font-semibold font-sans bg-pink-600 hover:bg-pink-700 transition"
        >
          Create Item
        </button>
      </div>
    </div>
  </body>
</html>
