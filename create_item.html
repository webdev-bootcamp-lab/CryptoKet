<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create New Item</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-[#0b0b0f] text-white min-h-screen">
    <div class="max-w-3xl mx-auto px-6 py-12 space-y-8">
      <!-- Page Header -->
      <h1 class="text-3xl font-bold">Create new item</h1>

      <!-- Upload Area -->
      <div
        id="dropZone"
        class="border-2 bg-[#15151d] border-dashed border-gray-600 rounded-xl p-8 text-center cursor-pointer hover:border-pink-500 transition"
      >
        <p class="text-sm">JPG, PNG, GIF, SVG, WEBM, MP3, MP4 • Max 100MB</p>
        <input type="file" id="fileInput" hidden />

        <div class="space-y-3">
          <!-- Picture Frame Icon -->
          <svg
            class="w-20 h-20 mx-auto my-4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            viewBox="0 0 24 24"
          >
            <rect
              x="3"
              y="3"
              width="18"
              height="18"
              rx="2"
              ry="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle
              cx="8"
              cy="8"
              r="1"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <polyline
              points="21 15 16 10 5 21"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>

          <p class="text-lg font-medium">
            Drag and Drop File <br /><span class="text-gray-400">or</span>
            browse media on your device
          </p>

          <p id="fileName" class="text-pink-500 font-medium hidden"></p>
        </div>
      </div>

      <p id="error" class="text-red-500 hidden"></p>

      <!-- Name -->
      <div>
        <label class="block mb-2 font-medium">Name</label>
        <input
          id="name"
          type="text"
          placeholder="Item Name"
          class="w-full bg-[#15151d] border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-pink-500"
        />
      </div>

      <!-- Description -->
      <div>
        <label class="block mb-2 font-medium">Description</label>
        <textarea
          id="description"
          rows="4"
          placeholder="Description of your item"
          class="w-full bg-[#15151d] border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-pink-500"
        ></textarea>
      </div>

      <!-- Price -->
      <div>
        <label class="block mb-2 font-medium">Price</label>
        <div class="flex gap-4">
          <input
            id="price"
            type="number"
            placeholder="Enter Price"
            class="flex-1 bg-[#15151d] border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-pink-500"
          />
          <select
            id="currency"
            class="bg-[#15151d] border border-gray-700 rounded-lg px-4 py-3"
          >
            <option value="ETH">ETH</option>
            <option value="BTC">BTC</option>
            <option value="USD">USD</option>
          </select>
        </div>
      </div>

      <!-- CTA -->
      <div class="flex justify-end">
        <button
          id="createBtn"
          class="w-60 py-4 rounded-xl font-semibold bg-pink-600 hover:bg-pink-700 transition cursor-pointer"
        >
          Create Item
        </button>
      </div>
    </div>

    <!-- JavaScript -->
    <script>
      const fileInput = document.getElementById("fileInput");
      const dropZone = document.getElementById("dropZone");
      const fileName = document.getElementById("fileName");
      const error = document.getElementById("error");

      const nameInput = document.getElementById("name");
      const priceInput = document.getElementById("price");
      const createBtn = document.getElementById("createBtn");

      const MAX_SIZE = 100 * 1024 * 1024;
      const SUPPORTED_TYPES = [
        "image/jpeg",
        "image/png",
        "image/gif",
        "image/svg+xml",
        "video/webm",
        "audio/mpeg",
        "video/mp4",
      ];

      let selectedFile = null;

      dropZone.addEventListener("click", () => fileInput.click());

      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("border-pink-500");
      });

      dropZone.addEventListener("dragleave", () => {
        dropZone.classList.remove("border-pink-500");
      });

      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("border-pink-500");
        handleFile(e.dataTransfer.files[0]);
      });

      fileInput.addEventListener("change", (e) => {
        handleFile(e.target.files[0]);
      });

      function handleFile(file) {
        error.classList.add("hidden");

        if (!SUPPORTED_TYPES.includes(file.type)) {
          showError("Unsupported file format");
          return;
        }

        if (file.size > MAX_SIZE) {
          showError("File exceeds 100MB limit");
          return;
        }

        selectedFile = file;
        fileName.textContent = file.name;
        fileName.classList.remove("hidden");
      }

      function showError(message) {
        error.textContent = message;
        error.classList.remove("hidden");
      }

      // Handle click and API submission
      createBtn.addEventListener("click", async () => {
        if (!selectedFile || !nameInput.value.trim() || !priceInput.value) {
          alert("Please fill all required fields.");
          return;
        }

        const formData = new FormData();
        formData.append("file", selectedFile);
        formData.append("name", nameInput.value.trim());
        formData.append(
          "description",
          document.getElementById("description").value.trim()
        );
        formData.append("price", priceInput.value);
        formData.append("currency", document.getElementById("currency").value);

        try {
          createBtn.textContent = "Uploading...";
          createBtn.disabled = true;

          const response = await fetch("apiurl.here", {
            method: "POST",
            body: formData,
          });

          if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.message || "Upload failed");
          }

          const data = await response.json();
          alert("NFT Item created successfully!");
          console.log(data);

          // Reset form (optional)
          fileName.textContent = "";
          fileName.classList.add("hidden");
          fileInput.value = "";
          nameInput.value = "";
          document.getElementById("description").value = "";
          priceInput.value = "";
          createBtn.textContent = "Create Item";
          createBtn.disabled = false;
        } catch (err) {
          console.error(err);
          alert("Error creating NFT: " + err.message);
          createBtn.textContent = "Create Item";
          createBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
